server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # MIME types for game assets that nginx doesn't ship by default.
    types {
        application/octet-stream  fbx;
        model/gltf-binary         glb;
        model/gltf+json           gltf;
        application/wasm          wasm;
    }

    # Hashed Next.js bundles — safe to cache aggressively
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Large game assets (models, textures, audio). Filename is stable per
    # release so a long max-age is fine; bump via image rebuild when needed.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML/manifest: revalidate so a redeploy is picked up immediately.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        model/gltf+json;

    # Don't ship server identity behind the host reverse proxy.
    server_tokens off;
}
