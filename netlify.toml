[build]
  command = "pnpm build"
  publish = "out/web"

[build.environment]
  NODE_VERSION = "20"

# Static export: serve /index.html for any unknown path so the /admin hash router
# and any future client-side routes resolve cleanly on hard refresh / direct links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache immutable assets on repeat visits (CDN + browser).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
