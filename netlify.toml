[build]
  command = "npm run build"
  publish = "out/web"

# Long-cache immutable assets on repeat visits (CDN + browser).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

